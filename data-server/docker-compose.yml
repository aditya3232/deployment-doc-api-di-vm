name: doc-api-database
services:
  postgres-doc-api:
    image: postgres:16
    container_name: postgres-doc-api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${DATABASE_HOST_PORT}:${DATABASE_CONT_PORT}"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - network-doc-api

  minio-doc-api:
    image: minio/minio:latest
    container_name: minio-doc-api
    ports:
      - "${MINIO_HOST_PORT}:${MINIO_CONT_PORT}"
      - "${MINIO_DASH_HOST_PORT}:${MINIO_DASH_CONT_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: >
      server /data
      --address ":${MINIO_CONT_PORT}"
      --console-address ":${MINIO_DASH_CONT_PORT}"
    volumes:
      - minio_data:/data
    networks:
      - network-doc-api

  redis-doc-api:
    image: redis:7.2
    container_name: redis-doc-api
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONT_PORT}"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save ""
      --appendonly no
      --maxclients 10000
      --timeout 0
      --tcp-keepalive 60
    networks:
      - network-doc-api

volumes:
  postgresql_data:
  minio_data:

networks:
  network-doc-api:
    driver: bridge
